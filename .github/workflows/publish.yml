---
name: Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without actually publishing to NPM'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          # node 24 ships with oidc support (npm CLI >= 11.5.1)

      - name: Install dependencies
        run: npm ci

      - name: Build + test
        run: npm test
        # `npm test` runs the full build (ESM + CJS) then the node test suite

      - name: Pack (dry-run)
        if: ${{ inputs.dry-run }}
        run: npm pack --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish
      # publishConfig.access = "public" in package.json handles scoped access.
      # OIDC authentication is used automatically by npm CLI 11.5.1+
      # No NPM_TOKEN secret needed — configure the Trusted Publisher on the
      # package settings at npmjs.com after the first (manual) publish.
      # See: https://docs.npmjs.com/trusted-publishers
